<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #374151;
            --sidebar-bg: #f9fafb;
            --border-color: #e5e7eb;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --code-bg: #f3f4f6;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #4b5563;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            margin-bottom: 0.5rem;
        }

        .sidebar a {
            color: #4b5563;
            text-decoration: none;
            font-size: 0.95rem;
            display: block;
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            transition: all 0.2s;
        }

        .sidebar a:hover {
            background-color: #f3f4f6;
            color: #111827;
        }

        .sidebar a.active {
            background-color: #eff6ff;
            color: #1d4ed8;
            font-weight: 600;
        }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            padding: 3rem 4rem;
            max-width: 800px;
            box-sizing: border-box;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            color: #111827;
            font-weight: 700;
            margin-top: 2rem;
            margin-bottom: 1rem;
            line-height: 1.25;
        }

        h1 {
            font-size: 2.25rem;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3rem;
        }

        p {
            margin-top: 0;
            margin-bottom: 1.5rem;
            line-height: 1.7;
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        pre, code {
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            background-color: var(--code-bg);
            border-radius: 0.375rem;
        }

        code {
            font-size: 0.875rem;
            padding: 0.2rem 0.4rem;
        }

        pre {
            padding: 1rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
        }

        pre code {
            padding: 0;
            background-color: transparent;
            font-size: 0.875rem;
        }

        ul, ol {
            margin-top: 0;
            margin-bottom: 1.5rem;
            padding-left: 2rem;
            line-height: 1.7;
        }

        li {
            margin-bottom: 0.5rem;
        }

        blockquote {
            margin: 0 0 1.5rem 0;
            padding-left: 1rem;
            border-left: 4px solid var(--border-color);
            color: #374151;
            font-style: italic;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>Navigation</h2>
        <ul>
            {% for page in sidebar_pages %}
            <li>
                <a href="{{ page.url }}" class="{% if page.active %}active{% endif %}">{{ page.title }}</a>
            </li>
            {% endfor %}
        </ul>
    </aside>
    <main class="main-content">
        {{ content }}
    </main>
    
    {% if live_reload %}
    <script>
        const sse = new EventSource('/__reload__');
        sse.onmessage = function(event) {
            if (event.data === 'reload') {
                console.log('File change detected, reloading...');
                window.location.reload();
            }
        };
    </script>
    {% endif %}
</body>
</html>
